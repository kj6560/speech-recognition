<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="assistant">
        <h1>Voice assistant</h1>
        <p class="status" id="status" role="status" aria-live="polite">
            Ready
        </p>

        <div class="controls">
            <button class="mic" id="micButton" type="button" aria-label="Start listening">
                🎙
            </button>
            <button class="stop" id="stopButton" type="button">Stop</button>
        </div>

        <form class="text-form" id="textForm" autocomplete="off">
            <label class="visually-hidden" for="textInput">Type a command</label>
            <input id="textInput" name="message" type="text" placeholder="Type a command">
            <button id="sendButton" type="submit">Send</button>
        </form>

        <section class="transcript" aria-live="polite">
            <p id="userText"></p>
            <p id="assistantText"></p>
            <p id="actionResult"></p>
        </section>
    </main>

    <script src="speech-assistant.js"></script>

    <script>
        const commandRoutes = [
            {
                intent: "dashboard",
                keywords: ["dashboard"],
                reply: "Opening your dashboard."
            },
            {
                intent: "customers",
                keywords: ["customer"],
                reply: "Sure! Let me show you the customers section."
            },
            {
                intent: "inventory",
                keywords: ["inventory"],
                reply: "Opening inventory management."
            },
            {
                intent: "sales-report",
                keywords: ["sales", "report"],
                reply: "Opening your sales report."
            },
            {
                intent: "help",
                keywords: ["help", "what can you do"],
                reply:
                    "I can open your dashboard, customers, inventory, or sales report."
            },
            {
                intent: "goodbye",
                keywords: ["goodbye", "bye"],
                reply: "Goodbye! Have a great day."
            }
        ];

        const assistant = new SpeechAssistant({
            onCommand: ({ command }) => {
                const route = commandRoutes.find(({ keywords }) =>
                    keywords.some((keyword) => command.includes(keyword))
                );
                console.log(command);
                if (!route) {
                    return {
                        reply: `I heard "${command}", but I do not have an action for it yet.`
                    };
                }

                return { reply: route.reply, intent: route.intent };
            }
        });

        const status = document.getElementById("status");
        const userText = document.getElementById("userText");
        const assistantText = document.getElementById("assistantText");
        const actionResult = document.getElementById("actionResult");
        const micButton = document.getElementById("micButton");
        const stopButton = document.getElementById("stopButton");
        const textForm = document.getElementById("textForm");
        const textInput = document.getElementById("textInput");

        const commandActions = {
            dashboard: () => showAction("Dashboard opened."),
            customers: () => showAction("Customers section opened."),
            inventory: () => showAction("Inventory section opened."),
            "sales-report": () => showAction("Sales report opened."),
            help: () => showAction("Help command handled."),
            goodbye: () => showAction("Goodbye command handled.")
        };

        function showAction(message) {
            actionResult.textContent = message;
        }

        assistant.on("status", ({ message }) => {
            status.textContent = message;
        });
        assistant.on("transcript", ({ transcript }) => {
            userText.textContent = transcript;
        });
        assistant.on("response", ({ message }) => {
            assistantText.textContent = message;
        });
        assistant.on("intent", ({ intent }) => {
            const action = commandActions[intent];
            if (action) action();
        });

        micButton.addEventListener("click", () => assistant.start());
        stopButton.addEventListener("click", () => assistant.stop());
        assistant.on("state", ({ listening }) => {
            micButton.classList.toggle("listening", listening);
        });
        textForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const message = textInput.value.trim();
            if (!message) return;

            assistant.sendText(message);
            textInput.value = "";
        });

        const support = assistant.getSupport();
        if (!support.canListen) {
            micButton.disabled = true;
            status.textContent = support.message;
        }
    </script>

</body>

</html>
